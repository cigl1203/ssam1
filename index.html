<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WORD MOLE | 영어 그림 두더지 잡기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#243250}
.game{max-width:970px;margin:18px auto;padding:22px;border-radius:27px;background:linear-gradient(145deg,#f0f8ff,#eaf8ed);box-shadow:0 18px 55px #1b497015}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.eyebrow{font-size:12px;color:#178f82;font-weight:900;letter-spacing:.12em}.title{margin:3px 0 5px;font-size:clamp(24px,4vw,34px);letter-spacing:-1.4px;line-height:1.2;font-weight:950}.desc{margin:0;color:#63758c;font-size:13px}.best{background:white;border-radius:17px;padding:10px 17px;text-align:center;box-shadow:0 4px 16px #35756715}.best small,.best strong{display:block}.best small{font-size:11px;color:#78849b}.best strong{font-size:22px;color:#ed8e31}
.frame{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;margin-top:20px}.play{border:1px solid #d5e8df;border-radius:24px;padding:18px;background:#fff;min-width:0}.challenge{background:#e9f7fc;border-radius:17px;text-align:center;padding:14px 10px;margin-bottom:4px;position:relative}.challenge .hint{font-size:12px;font-weight:800;color:#578899;margin-bottom:3px}.word{font-size:clamp(29px,5vw,50px);font-weight:1000;color:#23657c;letter-spacing:.1em;line-height:1.18;overflow-wrap:anywhere}.say{display:inline-flex;align-items:center;justify-content:center;vertical-align:5px;margin-left:8px;background:#fff;border:1px solid #cee7f3;border-radius:99px;min-width:36px;height:36px;font-size:18px;cursor:pointer}.feedback{height:27px;text-align:center;font-size:13px;font-weight:850;color:#238e76;padding-top:7px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0px 5px;background:linear-gradient(#fff 0%,#f9fef9 45%,#ecf9e8 100%);border-radius:18px;padding:10px 6px 4px;position:relative;overflow:hidden}.hole{position:relative;display:block;aspect-ratio:1.13;border:0;background:transparent;cursor:pointer;min-width:0;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.hole:disabled{cursor:default}.pit{position:absolute;z-index:1;left:5%;bottom:5%;width:90%;height:32%;border-radius:50%;background:#463a47;box-shadow:inset 0 6px 0 #2c2936}.mole{position:absolute;z-index:2;left:17%;bottom:17%;width:66%;height:73%;border-radius:46% 46% 32% 32%;border:3px solid #a97655;background:linear-gradient(145deg,#d8a780,#b97d5d);box-shadow:inset -7px -5px 0 #a5765640;opacity:0;transform:translateY(65%);pointer-events:none}.up .mole{animation:up .35s cubic-bezier(.15,1.4,.4,1) forwards}.ear{position:absolute;width:25%;height:25%;top:-9%;background:#bc8867;border:3px solid #a97655;border-radius:50%}.ear.left{left:5%}.ear.right{right:5%}.eye{position:absolute;top:20%;width:8%;height:10%;border-radius:50%;background:#322c36}.eye.left{left:33%}.eye.right{right:33%}.nose{position:absolute;top:32%;left:46%;width:9%;height:8%;border-radius:50%;background:#6d4944}.card{position:absolute;z-index:3;left:12%;top:44%;width:76%;height:63%;display:grid;place-items:center;background:#fff;border:3px solid #e6e9f1;border-radius:13px;box-shadow:0 3px 5px #6e46583d}.art{width:92%;height:92%;display:block;filter:drop-shadow(0 2px 1px #0001)}.paw{position:absolute;z-index:4;top:81%;width:21%;height:19%;border-radius:50%;background:#dbab86;border:2px solid #a97655}.paw.left{left:4%}.paw.right{right:4%}.lip{position:absolute;z-index:5;bottom:2%;left:2%;width:96%;height:19%;background:#81c593;border-radius:50% 50% 46% 46%;clip-path:polygon(0 40%,17% 12%,35% 35%,55% 12%,73% 33%,100% 20%,100% 100%,0 100%);pointer-events:none}.hole.up:hover .mole{filter:brightness(1.045)}.hole.correct .mole{filter:drop-shadow(0 0 9px #31c88e)}.hole.wrong{animation:shake .3s ease}.hole.wrong .card{border-color:#f47b7b}.hole:focus-visible{outline:3px solid #468bd9;border-radius:14px}.sidebar{display:flex;flex-direction:column;gap:13px}.stat{background:white;border-radius:19px;padding:15px;box-shadow:0 4px 12px #38698b0c}.statline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.statline:last-child{margin-bottom:0}.stat label{font-size:13px;font-weight:800;color:#66768c}.stat strong{font-size:24px;color:#27334d}.stat .big{color:#e9893a}.timerbar{height:9px;background:#f1edea;border-radius:8px;overflow:hidden;margin-top:9px}.timerfill{width:100%;height:100%;background:linear-gradient(90deg,#56c9a6,#8cdec3);transition:width .4s}.note{font-size:12px;line-height:1.65;color:#67798e;margin:0}.primary{width:100%;border:0;border-radius:15px;background:#257bb1;color:white;font-size:17px;font-weight:950;padding:15px 10px;cursor:pointer;box-shadow:0 6px 0 #17517c;transition:transform .15s}.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #17517c}.primary:disabled{opacity:.68;cursor:default}.pillrow{display:flex;gap:7px}.pill{flex:1;border:1px solid #d8e4e9;border-radius:12px;background:white;padding:9px 5px;color:#59697e;font-size:12px;font-weight:850;cursor:pointer}.pill.active{background:#dff4ee;border-color:#2fa890;color:#17846e}.pill:disabled{opacity:.5;cursor:default}.end{display:none;background:#fffdf4;border:2px solid #ffdea3;border-radius:17px;padding:14px;text-align:center}.end.show{display:block}.end h3{font-size:20px;margin:0 0 4px}.end p{font-size:13px;color:#7f6970;margin:4px 0 11px}.review{max-height:136px;overflow:auto;text-align:left;display:flex;flex-wrap:wrap;gap:6px}.review span{background:#fff0d4;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:700}.footer{margin:12px 0 0;text-align:center;color:#90a096;font-size:12px}@keyframes up{to{opacity:1;transform:translateY(0)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media(max-width:660px){.game{padding:13px;margin:0;border-radius:0}.top{padding:5px}.frame{grid-template-columns:1fr;margin-top:14px;gap:11px}.play{padding:11px}.sidebar{display:grid;grid-template-columns:1fr 1fr}.sidebar .stat:nth-child(1){grid-column:1/-1}.sidebar .primary,.sidebar .note,.sidebar .end{grid-column:1/-1}.hole{aspect-ratio:1.07}.board{padding:9px 3px 4px}.card{border-width:2px;border-radius:9px}.mole{border-width:2px}}
@media(prefers-reduced-motion:reduce){.up .mole{animation:none;opacity:1;transform:none}.hole.wrong{animation:none}}
</style>
</head>
<body>
<div class="game" id="wordMole">
 <header class="top"><div><div class="eyebrow">🎮 LEARN & PLAY</div><h1 class="title">🐹 영어 그림 두더지 잡기</h1><p class="desc">영단어를 보고 알맞은 그림을 든 두더지를 찾아보세요!</p></div><div class="best"><small>🏆 최고 점수</small><strong id="best">0</strong></div></header>
 <div class="frame">
 <section class="play">
  <div class="challenge"><div class="hint">이 단어와 일치하는 그림을 찾아요!</div><div><span class="word" id="word">APPLE</span><button class="say" id="say" aria-label="영단어 발음 듣기" title="발음 듣기">🔊</button></div></div>
  <div class="feedback" id="feedback" aria-live="polite">시작 버튼을 누르면 게임이 시작돼요!</div>
  <div class="board" id="board" aria-label="두더지 게임판"></div>
 </section>
 <aside class="sidebar">
  <div class="stat"><div class="statline"><label>⏱️ 남은 시간</label><strong><span id="time">45</span>초</strong></div><div class="timerbar"><div class="timerfill" id="timerfill"></div></div></div>
  <div class="stat"><div class="statline"><label>⭐ 점수</label><strong class="big" id="score">0</strong></div><div class="statline"><label>✅ 정답</label><strong id="correct">0</strong></div></div>
  <div class="stat"><div class="statline"><label>🔥 연속 정답</label><strong id="streak">0</strong></div><div class="statline"><label>❌ 오답 클릭</label><strong id="misses">0</strong></div></div>
  <div class="pillrow" id="duration"><button class="pill active" type="button" data-seconds="45">45초</button><button class="pill" type="button" data-seconds="60">60초</button></div>
  <button class="primary" id="start" type="button">▶ 게임 시작!</button>
  <div class="end" id="end"><h3>🎉 게임 종료!</h3><p id="summary"></p><div class="review" id="review"></div></div>
  <p class="note">💡 정답 그림을 누르면 <b>10점</b>! 틀려도 다시 고를 수 있어요. 정답을 맞히면 영어 단어와 한글 뜻을 확인한 후 다음 문제로 넘어가요.</p>
 </aside></div>
 <p class="footer">총 12개의 영어 단어 · 그림 카드 · 발음 듣기 · 최고 기록 저장</p>
</div>
<script>
(()=>{
const host=document.getElementById('wordMole');if(host.dataset.initialized)return;host.dataset.initialized='true';
const $=id=>host.querySelector('#'+id);
const svg=body=>`<svg xmlns="http://www.w3.org/2000/svg" class="art" viewBox="0 0 100 100" role="presentation">${body}</svg>`;
const art={
APPLE:svg('<path d="M51 28 Q43 17 49 9" fill="none" stroke="#6b5b46" stroke-width="6" stroke-linecap="round"/><path d="M48 19Q66 4 78 15Q62 30 48 19" fill="#4fae66"/><path d="M50 34C24 13 9 40 19 66C27 89 39 91 50 85C65 93 79 76 83 55C88 28 69 20 50 34Z" fill="#ef5e5e" stroke="#cb4148" stroke-width="3"/><ellipse cx="32" cy="45" rx="7" ry="13" fill="#fff" opacity=".3" transform="rotate(24 32 45)"/>'),
BANANA:svg('<path d="M17 19C13 69 55 96 88 54C72 70 34 72 25 21Z" fill="#ffce52" stroke="#c99530" stroke-width="4"/><path d="M20 25C25 64 49 79 76 65" fill="none" stroke="#ffe893" stroke-width="5" stroke-linecap="round"/><path d="M16 15L29 18L28 27L17 26ZM83 52L92 51L91 58L84 61Z" fill="#766044"/>'),
CAT:svg('<path d="M20 45L23 13L44 28Q51 25 58 29L79 13L82 46Q89 81 51 88Q13 82 20 45Z" fill="#f9bb70" stroke="#cc8447" stroke-width="3"/><path d="M28 22L29 39L41 31ZM72 22L70 39L58 31Z" fill="#e98e9a"/><ellipse cx="38" cy="53" rx="4" ry="6" fill="#3f3a42"/><ellipse cx="63" cy="53" rx="4" ry="6" fill="#3f3a42"/><path d="M45 65L56 65L50 71Z" fill="#c96979"/><path d="M50 71Q42 78 36 71M50 71Q60 79 65 71M28 66L10 62M29 73L9 77M72 66L90 62M72 73L91 77" fill="none" stroke="#705547" stroke-width="2.5" stroke-linecap="round"/>'),
DOG:svg('<path d="M20 36Q7 25 7 48Q7 73 27 70L34 42ZM80 36Q93 25 93 48Q93 73 73 70L66 42Z" fill="#92613e"/><ellipse cx="50" cy="55" rx="32" ry="36" fill="#d6a16d" stroke="#a97648" stroke-width="3"/><ellipse cx="38" cy="51" rx="4" ry="5" fill="#342d36"/><ellipse cx="62" cy="51" rx="4" ry="5" fill="#342d36"/><ellipse cx="50" cy="68" rx="17" ry="14" fill="#ffe4bf"/><path d="M43 64Q50 59 57 64L51 72H49Z" fill="#3e323a"/><path d="M50 73Q50 84 56 83Q63 79 54 72" fill="#eb7a82"/>'),
CAR:svg('<rect x="10" y="43" width="80" height="34" rx="11" fill="#5da5dc" stroke="#3976a3" stroke-width="3"/><path d="M26 45L38 24H68L79 45Z" fill="#5da5dc" stroke="#3976a3" stroke-width="3"/><path d="M40 29H64L72 44H32Z" fill="#d4effc"/><circle cx="28" cy="76" r="11" fill="#343e55"/><circle cx="73" cy="76" r="11" fill="#343e55"/><circle cx="28" cy="76" r="5" fill="#d2dce5"/><circle cx="73" cy="76" r="5" fill="#d2dce5"/>'),
FISH:svg('<path d="M68 40L91 22V77L68 59Z" fill="#3b9fbd" stroke="#287d9b" stroke-width="3"/><ellipse cx="43" cy="50" rx="37" ry="25" fill="#67c6d8" stroke="#2b93ab" stroke-width="3"/><path d="M44 31L59 18L62 38" fill="#2b9cb8"/><circle cx="26" cy="44" r="5" fill="#344257"/><circle cx="25" cy="42" r="2" fill="white"/><path d="M13 57Q21 65 29 58" fill="none" stroke="#3f8ba5" stroke-width="3"/><path d="M53 41Q57 50 53 60M63 41Q67 50 63 60" fill="none" stroke="#3999b2" stroke-width="3"/>'),
SUN:svg('<g stroke="#f7a936" stroke-width="7" stroke-linecap="round"><path d="M50 7V19M50 81V93M7 50H19M81 50H93M20 20L29 29M71 71L80 80M80 20L71 29M29 71L20 80"/></g><circle cx="50" cy="50" r="28" fill="#ffd45b" stroke="#f6ae3c" stroke-width="3"/><circle cx="40" cy="46" r="3" fill="#8f6641"/><circle cx="60" cy="46" r="3" fill="#8f6641"/><path d="M41 58Q50 68 59 58" fill="none" stroke="#8f6641" stroke-width="3" stroke-linecap="round"/>'),
MOON:svg('<path d="M69 10C37 5 16 28 17 56C18 83 46 98 69 84C48 84 36 65 38 47C40 28 53 15 69 10Z" fill="#f7c35b" stroke="#dda144" stroke-width="3"/><circle cx="68" cy="41" r="6" fill="#f7d285"/><circle cx="60" cy="69" r="4" fill="#f7d285"/>'),
STAR:svg('<path d="M50 7L63 34L94 38L72 59L78 90L50 76L22 90L28 59L6 38L37 34Z" fill="#9e89dc" stroke="#7f68c6" stroke-width="4" stroke-linejoin="round"/><path d="M34 40L42 27M26 48L32 45" stroke="white" stroke-width="5" opacity=".5" stroke-linecap="round"/>'),
BALL:svg('<circle cx="50" cy="50" r="40" fill="#f0a857" stroke="#bb6a31" stroke-width="4"/><path d="M10 50H90M50 10V90M23 21Q50 50 23 79M77 21Q50 50 77 79" fill="none" stroke="#91522d" stroke-width="4"/>'),
TREE:svg('<rect x="43" y="60" width="15" height="32" rx="4" fill="#986b4b"/><circle cx="33" cy="43" r="22" fill="#66b87b"/><circle cx="62" cy="38" r="25" fill="#58a96e"/><circle cx="53" cy="58" r="24" fill="#72c989"/><path d="M26 35Q37 25 42 31" stroke="#a1deb0" stroke-width="5" fill="none" stroke-linecap="round"/>'),
FLOWER:svg('<path d="M50 55V92M50 78Q28 63 21 78Q34 89 50 83M50 75Q69 61 79 76Q70 86 50 82" fill="none" stroke="#4aa16f" stroke-width="6" stroke-linecap="round"/><g fill="#f2a2b9" stroke="#dc7599" stroke-width="2"><ellipse cx="50" cy="25" rx="12" ry="20"/><ellipse cx="50" cy="66" rx="12" ry="20"/><ellipse cx="28" cy="45" rx="20" ry="12"/><ellipse cx="72" cy="45" rx="20" ry="12"/><ellipse cx="34" cy="29" rx="13" ry="17" transform="rotate(-42 34 29)"/><ellipse cx="66" cy="29" rx="13" ry="17" transform="rotate(42 66 29)"/></g><circle cx="50" cy="45" r="16" fill="#ffd25e" stroke="#f1b548" stroke-width="3"/>')
};
const words=[['APPLE','사과'],['BANANA','바나나'],['CAT','고양이'],['DOG','강아지'],['CAR','자동차'],['FISH','물고기'],['SUN','태양'],['MOON','달'],['STAR','별'],['BALL','공'],['TREE','나무'],['FLOWER','꽃']].map(([en,ko])=>({en,ko}));
let seconds=45,left=45,playing=false,locked=false,score=0,correct=0,misses=0,streak=0,best=0,timer=null,roundTimer=null,bag=[],target=null,seen=[];
try{best=Number(localStorage.getItem('word-mole-best-v1'))||0}catch(e){}$('best').textContent=best;
const random=n=>Math.floor(Math.random()*n);
function shuffle(xs){let a=[...xs];for(let i=a.length-1;i>0;i--){const j=random(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function update(){ $('time').textContent=left;$('score').textContent=score;$('correct').textContent=correct;$('streak').textContent=streak;$('misses').textContent=misses;$('timerfill').style.width=(left/seconds*100)+'%';$('best').textContent=best;}
function message(s,color){$('feedback').textContent=s;$('feedback').style.color=color||'#238e76';}
function draw(picks,active){const positions=shuffle(Array.from({length:9},(_,i)=>i)).slice(0,picks.length);let cells=Array(9).fill(null);positions.forEach((pos,i)=>cells[pos]=picks[i]);const board=$('board');board.replaceChildren();cells.forEach((item,i)=>{const b=document.createElement('button');b.type='button';b.className='hole'+(item?' up':'');b.disabled=!item;b.setAttribute('aria-label',item?`${item.ko} 그림 두더지`:'빈 구멍');b.innerHTML='<span class="pit"></span>'+(item?`<span class="mole"><span class="ear left"></span><span class="ear right"></span><span class="eye left"></span><span class="eye right"></span><span class="nose"></span><span class="card">${art[item.en]}</span><span class="paw left"></span><span class="paw right"></span></span>`:'')+'<span class="lip"></span>';if(item)b.addEventListener('click',()=>{if(!playing){start();return;}hit(b,item);});board.appendChild(b);});}
function newRound(){if(!playing)return;if(!bag.length)bag=shuffle(words);target=bag.pop();$('word').textContent=target.en;let distractors=shuffle(words.filter(w=>w.en!==target.en)).slice(0,3);draw(shuffle([target,...distractors]));locked=false;message('올바른 그림을 클릭해 보세요!');}
function hit(button,item){if(!playing||locked)return;if(item.en===target.en){locked=true;score+=10;correct++;streak++;seen.push(target);button.classList.add('correct');message(`정답! ${target.en} = ${target.ko}  +10점 🎉`);if(score>best){best=score;try{localStorage.setItem('word-mole-best-v1',String(best))}catch(e){}}update();roundTimer=setTimeout(newRound,930);}else{misses++;streak=0;button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');message('아쉬워요! 다시 찾아보세요 😊','#e46c65');update();}}
function finish(){playing=false;locked=true;clearInterval(timer);clearTimeout(roundTimer);$('start').disabled=false;$('start').textContent='↻ 다시 도전하기';host.querySelectorAll('.pill').forEach(x=>x.disabled=false);message('게임이 끝났어요! 복습 단어도 확인해 보세요.');$('summary').textContent=`${score}점 · 정답 ${correct}개 · 오답 클릭 ${misses}번`;$('end').classList.add('show');$('review').replaceChildren();if(seen.length){const unique=[...new Map(seen.map(w=>[w.en,w])).values()];unique.forEach(w=>{const s=document.createElement('span');s.textContent=w.en+' = '+w.ko;$('review').appendChild(s);});}else{$('review').textContent='이번엔 정답이 없었어요. 다시 도전해 보세요!';}update();}
function start(){clearInterval(timer);clearTimeout(roundTimer);playing=true;locked=false;score=correct=misses=streak=0;left=seconds;bag=[];seen=[];$('end').classList.remove('show');$('start').textContent='게임 진행 중…';$('start').disabled=true;host.querySelectorAll('.pill').forEach(x=>x.disabled=true);update();newRound();timer=setInterval(()=>{if(!playing)return;left=Math.max(0,left-1);update();if(left===0)finish();},1000);}
$('start').onclick=start;
host.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{if(playing)return;seconds=Number(b.dataset.seconds);left=seconds;host.querySelectorAll('.pill').forEach(x=>x.classList.toggle('active',x===b));update();});
$('say').onclick=()=>{if(!('speechSynthesis' in window)) {message('이 브라우저에서는 발음 기능을 사용할 수 없어요.','#e46c65');return;}try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($('word').textContent.toLowerCase());u.lang='en-US';u.rate=.8;window.speechSynthesis.speak(u);}catch(e){message('발음 재생을 지원하지 않는 환경이에요.','#e46c65');}};
$('word').textContent='APPLE';draw([words[0],words[2],words[4],words[5]]);update();
})();
</script>
</body>
</html>
